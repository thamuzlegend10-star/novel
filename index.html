<!DOCTYPE html>
<html lang="en" data-site-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dreams On</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F1E7;
    --ink: #2A2118;
    --ink-soft: #5A4E3F;
    --accent: #8A3324;
    --accent-soft: #B3593F;
    --hairline: rgba(42,33,24,0.14);
    --bar-bg: #211A13;
    --bar-fg: #EFE3CF;
    --ember: rgba(179, 89, 63, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130F;
      --ink: #EDE3D2;
      --ink-soft: #B7A88F;
      --accent: #D98A6E;
      --accent-soft: #E3A88F;
      --hairline: rgba(237,227,210,0.14);
      --bar-bg: #0F0C09;
      --bar-fg: #EFE3CF;
      --ember: rgba(217, 138, 110, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130F;
    --ink: #EDE3D2;
    --ink-soft: #B7A88F;
    --accent: #D98A6E;
    --accent-soft: #E3A88F;
    --hairline: rgba(237,227,210,0.14);
    --bar-bg: #0F0C09;
    --bar-fg: #EFE3CF;
    --ember: rgba(217, 138, 110, 0.35);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px)); scroll-behavior: smooth; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- Language toggle ---------- */
  [data-site-lang="en"] [lang="id"] { display: none; }
  [data-site-lang="id"] [lang="en"] { display: none; }

  .lang-toggle {
    display: flex;
    align-items: center;
    gap: 2px;
    background: rgba(239,227,207,0.08);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--bar-fg);
    opacity: 0.55;
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  .lang-toggle button.active {
    opacity: 1;
    background: rgba(239,227,207,0.16);
  }
  .lang-toggle button:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }

  /* ---------- Taskbar ---------- */
  .taskbar {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 clamp(16px, 4vw, 40px);
    background: var(--bar-bg);
    color: var(--bar-fg);
    z-index: 100;
    border-bottom: 1px solid rgba(239,227,207,0.08);
  }
  .brand {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.01em;
    color: var(--bar-fg);
    text-decoration: none;
    flex-shrink: 0;
  }
  /* ---------- Chapter selector (dropdown) ---------- */
  .chapter-select {
    position: relative;
    flex: 1;
    min-width: 0;
    max-width: 320px;
  }
  .chapter-select-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    appearance: none;
    border: 1px solid rgba(239,227,207,0.16);
    background: rgba(239,227,207,0.06);
    color: var(--bar-fg);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .chapter-select-btn:hover,
  .chapter-select-btn:focus-visible {
    background: rgba(239,227,207,0.12);
    border-color: var(--accent-soft);
  }
  .chapter-select-btn:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
  .chapter-select-btn .current {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chapter-select-btn .chevron {
    flex-shrink: 0;
    width: 10px;
    height: 10px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg) translateY(-2px);
    opacity: 0.7;
    transition: transform 0.2s ease;
  }
  .chapter-select.open .chevron { transform: rotate(225deg) translateY(1px); }

  .chapter-select-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    min-width: 240px;
    background: var(--bar-bg);
    border: 1px solid rgba(239,227,207,0.14);
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    z-index: 110;
  }
  .chapter-select.open .chapter-select-menu {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .chapter-select-menu a {
    display: block;
    color: var(--bar-fg);
    text-decoration: none;
    font-size: 0.88rem;
    padding: 9px 12px;
    border-radius: 8px;
    opacity: 0.75;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  .chapter-select-menu a:hover,
  .chapter-select-menu a:focus-visible {
    opacity: 1;
    background: rgba(239,227,207,0.08);
  }
  .chapter-select-menu a.active {
    opacity: 1;
    color: var(--accent-soft);
  }

  /* ---------- Ambient idle motes (decorative, non-blocking) ---------- */
  .ambient {
    position: fixed;
    inset: 0;
    top: 64px;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .mote {
    position: absolute;
    bottom: -5%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ember);
    filter: blur(0.5px);
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.7; }
    92%  { opacity: 0.5; }
    100% { transform: translateY(-115vh) translateX(var(--dx, 20px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mote { animation: none; display: none; }
    html { scroll-behavior: auto; }
  }

  /* ---------- Content ---------- */
  main {
    position: relative;
    z-index: 2;
    max-width: 680px;
    margin: 0 auto;
    padding: calc(64px + 64px) 24px 120px;
  }
  .chapter-page { display: none; }
  .chapter-page.active { display: block; }

  .chapter-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 56px;
    padding-top: 28px;
    border-top: 1px solid var(--hairline);
  }
  .pager-spacer { flex: 1; }
  .pager-btn {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 0.95rem;
    font-style: italic;
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .pager-btn:hover, .pager-btn:focus-visible {
    color: var(--accent);
    border-color: var(--accent-soft);
  }
  .pager-prev { text-align: left; }
  .pager-next { text-align: right; margin-left: auto; }
  .hero {
    padding-bottom: 40px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--hairline);
  }
  .hero .label {
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin: 0 0 14px;
  }
  .hero h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: clamp(2.1rem, 5vw, 3.1rem);
    line-height: 1.12;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .hero .sub {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1.05rem;
    margin: 0;
    max-width: 52ch;
  }

  article { font-size: 1.08rem; line-height: 1.8; }
  article h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.3rem;
    color: var(--accent);
    margin: 2.4em 0 0.8em;
  }
  article p { margin: 0 0 1.3em; color: var(--ink); max-width: 66ch; }
  article blockquote {
    margin: 1.6em 0;
    padding: 0.2em 0 0.2em 1.2em;
    border-left: 2px solid var(--accent-soft);
    font-style: italic;
    color: var(--ink-soft);
  }

  article hr.divider {
    border: none;
    height: 1px;
    background: var(--hairline);
    margin: 2.6em auto;
    width: 60px;
  }
  .chapter-end {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    color: var(--ink-soft);
    font-size: 0.9rem;
    font-style: italic;
  }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 32px 24px calc(48px + env(safe-area-inset-bottom, 0px));
    color: var(--ink-soft);
    font-size: 0.8rem;
  }

  @media (max-width: 560px) {
    .brand { font-size: 1rem; }
    main { padding-top: 108px; }
    .chapter-select-btn { font-size: 0.8rem; padding: 7px 10px; }
    .chapter-select { max-width: none; }
  }

  /* ---------- Per-chapter themes (set on <html data-chapter> by the router) ---------- */
  html[data-chapter="ch1"] { --tl:#8A3324; --tls:#B3593F; --td:#D98A6E; --tds:#E3A88F; }
  html[data-chapter="ch2"] { --tl:#5F7A86; --tls:#87A3B0; --td:#9DB4C0; --tds:#B9CDD6; }
  html[data-chapter="ch3"] { --tl:#7B4B94; --tls:#A678C0; --td:#C39BDB; --tds:#D4B6E6; }
  html[data-chapter="ch4"] { --tl:#2F6A8F; --tls:#5A9CC4; --td:#7DB6DA; --tds:#A3CBE6; }
  html[data-chapter="ch5"] { --tl:#946500; --tls:#C99A1C; --td:#E3B94F; --tds:#EBCB7C; }
  html[data-chapter] { --accent: var(--tl); --accent-soft: var(--tls); --ember: color-mix(in srgb, var(--tls) 38%, transparent); }
  @media (prefers-color-scheme: dark) {
    html[data-chapter]:not([data-theme="light"]) { --accent: var(--td); --accent-soft: var(--tds); --ember: color-mix(in srgb, var(--td) 38%, transparent); }
  }
  html[data-theme="dark"][data-chapter] { --accent: var(--td); --accent-soft: var(--tds); --ember: color-mix(in srgb, var(--td) 38%, transparent); }
  html[data-chapter] .taskbar { border-bottom-color: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
  html[data-chapter] .hero { border-bottom-color: color-mix(in srgb, var(--accent-soft) 38%, transparent); }
  html[data-chapter] ::selection { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }

  @supports not (color: color-mix(in srgb, red 50%, transparent)) {
    html[data-chapter] { --ember: var(--tls); }
    html[data-theme="dark"][data-chapter] { --ember: var(--td); }
  }
  @media (prefers-color-scheme: dark) {
    @supports not (color: color-mix(in srgb, red 50%, transparent)) {
      html[data-chapter]:not([data-theme="light"]) { --ember: var(--td); }
    }
  }

  /* ---------- Chapter epigraph card (echoes the dark "Lesson" quote page) ---------- */
  .epigraph {
    position: relative; overflow: hidden; margin: 0 0 44px; padding: 34px 30px 28px;
    border-radius: 16px; color: #EDE3D2;
    background: #0a0910;
    background: radial-gradient(120% 150% at 0% 0%, color-mix(in srgb, var(--accent-soft) 24%, #0a0910) 0%, #0a0910 64%);
    border: 1px solid rgba(237,227,210,0.16);
    border: 1px solid color-mix(in srgb, var(--accent-soft) 30%, transparent);
    box-shadow: 0 18px 40px -22px rgba(0,0,0,0.55);
  }
  .epigraph::before {
    content: attr(data-num); position: absolute; right: 20px; top: -14px;
    font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 7.5rem; line-height: 1;
    color: var(--accent-soft); opacity: 0.12; pointer-events: none;
  }
  .epigraph .ep-label { margin: 0 0 16px; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-soft); }
  .epigraph blockquote {
    position: relative; margin: 0; padding: 0; border: none; font-style: normal;
    font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: clamp(1.25rem, 3.6vw, 1.6rem);
    line-height: 1.42; color: #F3EADB;
  }
  .epigraph .ep-by { margin: 20px 0 0; font-size: 0.85rem; font-style: italic; color: rgba(237,227,210,0.62); }

  /* ---------- Epigraph motion: subtle, slow, never blocks reading ---------- */
  .chapter-page.active .epigraph { animation: epIn 0.9s cubic-bezier(.2,.7,.2,1) both, epGlow 7s 1s ease-in-out infinite; }
  .chapter-page.active .epigraph blockquote { animation: epText 0.9s 0.25s cubic-bezier(.2,.7,.2,1) both; }
  .chapter-page.active .epigraph .ep-by { animation: epText 0.9s 0.55s cubic-bezier(.2,.7,.2,1) both; }
  .epigraph .ep-label::before {
    content: ""; display: inline-block; width: 28px; height: 1px; margin-right: 10px; vertical-align: middle;
    background: var(--accent-soft); transform-origin: left center;
  }
  .chapter-page.active .epigraph .ep-label::before { animation: epLine 1s 0.3s ease-out both; }
  .chapter-page.active .epigraph::before { animation: epFloat 9s ease-in-out infinite; }
  .epigraph::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.07), transparent);
    transform: translateX(-150%) skewX(-18deg);
  }
  .chapter-page.active .epigraph::after { animation: epSweep 10s 1.4s ease-in-out infinite; }
  @keyframes epIn { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes epText { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes epLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes epFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
  @keyframes epSweep { 0%, 55% { transform: translateX(-150%) skewX(-18deg); } 100% { transform: translateX(380%) skewX(-18deg); } }
  @keyframes epGlow {
    0%, 100% { box-shadow: 0 18px 40px -22px rgba(0,0,0,0.55), 0 0 0 0 rgba(0,0,0,0); }
    50% { box-shadow: 0 18px 44px -20px rgba(0,0,0,0.55), 0 0 30px -8px color-mix(in srgb, var(--accent-soft) 38%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .epigraph, .epigraph *, .epigraph::before, .epigraph::after { animation: none !important; }
    .epigraph::after { display: none; }
  }

  /* ---------- Epigraph orbit: planets circling a numeral + a light orbiting the card border ---------- */
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .epigraph::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    font-size: inherit; right: auto; top: auto; opacity: 1;
    background: conic-gradient(from var(--ang), transparent 0deg, transparent 235deg, var(--accent-soft) 330deg, #fff 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  .chapter-page.active .epigraph::before { animation: epSpin 7s linear infinite; }
  .chapter-page.active .epigraph::after { animation: none; display: none; }
  @keyframes epSpin { to { --ang: 360deg; } }

  .epigraph .ep-label, .epigraph blockquote, .epigraph .ep-by { position: relative; z-index: 1; }
  .epigraph .orbit { position: absolute; right: -62px; top: 50%; width: 250px; height: 250px; margin-top: -125px; pointer-events: none; z-index: 0; }
  .chapter-page.active .epigraph .orbit { animation: epFade 1.4s 0.2s ease-out both; }
  .epigraph .o-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 4rem; color: var(--accent-soft); opacity: 0.16;
  }
  .epigraph .o-tilt { position: absolute; inset: 0; transform: perspective(620px) rotateX(66deg) rotateZ(-24deg); }
  .epigraph .ring {
    position: absolute; border-radius: 50%; border: 1px solid rgba(237,227,210,0.14);
    border: 1px solid color-mix(in srgb, var(--accent-soft) 34%, transparent);
  }
  .epigraph .r1 { inset: 0; }
  .epigraph .r2 { inset: 17%; }
  .epigraph .r3 { inset: 34%; }
  .chapter-page.active .epigraph .r1 { animation: oSpin 17s linear infinite; }
  .chapter-page.active .epigraph .r2 { animation: oSpin 10.5s linear infinite reverse; }
  .chapter-page.active .epigraph .r3 { animation: oSpin 6.5s linear infinite; }
  .epigraph .ring i {
    position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
    background: var(--accent-soft); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--accent-soft) 70%, transparent);
  }
  .epigraph .r1 i { width: 8px; height: 8px; top: -4px; margin-left: -4px; background: #fff; }
  @keyframes oSpin { to { transform: rotate(360deg); } }
  @keyframes epFade { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: none; } }
  @media (max-width: 560px) { .epigraph .orbit { width: 210px; height: 210px; margin-top: -105px; right: -56px; } }
  @media (prefers-reduced-motion: reduce) { .epigraph .o-tilt .ring { animation: none !important; } }

  .gate { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); }
  .gate[hidden] { display: none; }
  .gate-card { width: 100%; max-width: 360px; text-align: center; }
  .gate-card h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(2rem, 8vw, 2.6rem);
    margin: 0 0 6px; letter-spacing: -0.01em; }
  .gate-card p.gate-sub { margin: 0 0 28px; color: var(--ink-soft); font-style: italic; }
  .pin-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .pin-row input { width: 48px; height: 58px; text-align: center; font-family: "Fraunces", Georgia, serif;
    font-size: 1.6rem; color: var(--ink); background: transparent; border: 1px solid var(--hairline);
    border-bottom: 2px solid var(--ink-soft); border-radius: 8px; padding: 0; caret-color: var(--accent); }
  .pin-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ember); }
  .pin-row.shake { animation: gshake .4s; }
  .pin-row.err input { border-color: var(--accent); }
  @keyframes gshake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .gate-msg { min-height: 1.4em; margin: 0 0 18px; color: var(--accent); font-size: .95rem; }
  .gate-btn { appearance: none; border: none; cursor: pointer; font-family: inherit; font-size: 1rem;
    background: var(--bar-bg); color: var(--bar-fg); padding: 12px 28px; border-radius: 999px; }
  .gate-btn:disabled { opacity: .5; cursor: default; }
  .gate-btn:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; }
  .gate-lang { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
    background: var(--bar-bg); }
  @media (prefers-reduced-motion: reduce) { .pin-row.shake { animation: none; } }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <div class="lang-toggle gate-lang" role="group" aria-label="Language">
      <button type="button" data-gate-lang="en" class="active">EN</button>
      <button type="button" data-gate-lang="id">ID</button>
    </div>
    <form class="gate-card" id="gateForm" autocomplete="off" novalidate>
      <h1>Dreams On</h1>
      <p class="gate-sub"><span lang="en">Enter the 5-digit code to read.</span><span lang="id">Masukkan 5 digit kode untuk membaca.</span></p>
      <div class="pin-row" id="pinRow">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1" autocomplete="off">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2" autocomplete="off">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3" autocomplete="off">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4" autocomplete="off">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 5" autocomplete="off">
      </div>
      <p class="gate-msg" id="gateMsg" role="alert" aria-live="polite"></p>
      <button type="submit" class="gate-btn" id="gateBtn"><span lang="en">Unlock</span><span lang="id">Buka</span></button>
    </form>
  </div>

<script>
function initApp() {

  // Language toggle — switches html[data-site-lang], persists per-viewer via localStorage
  (function() {
    var html = document.documentElement;
    var buttons = document.querySelectorAll('.lang-toggle button');

    function setLang(lang) {
      html.setAttribute('data-site-lang', lang);
      buttons.forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-set-lang') === lang);
      });
      try { localStorage.setItem('bh_lang', lang); } catch (e) {}

      // Refresh the chapter dropdown's current label to match the new language,
      // keeping whichever chapter is currently selected.
      var btnLabel = document.querySelector('#chapterSelectBtn .current');
      var activeLink = document.querySelector('.chapter-select-menu a.active') || document.querySelector('.chapter-select-menu a');
      if (btnLabel && activeLink) {
        var text = lang === 'id' ? activeLink.getAttribute('data-label-id') : activeLink.getAttribute('data-label-en');
        var prefix = lang === 'id' ? 'Pilih Bab — ' : 'Select Chapter — ';
        btnLabel.textContent = prefix + text;
      }
    }

    buttons.forEach(function(b) {
      b.addEventListener('click', function() {
        setLang(b.getAttribute('data-set-lang'));
      });
    });

    try {
      var saved = localStorage.getItem('bh_lang');
      if (saved === 'en' || saved === 'id') setLang(saved);
    } catch (e) {}
  })();

  // Chapter dropdown — open/close, current-label update, click-outside + Escape to close
  (function() {
    var wrap = document.getElementById('chapterSelect');
    var btn = document.getElementById('chapterSelectBtn');
    var btnLabel = btn.querySelector('.current');
    var menu = wrap.querySelector('.chapter-select-menu');
    var links = Array.prototype.slice.call(menu.querySelectorAll('a'));

    function closeMenu() {
      wrap.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
    function openMenu() {
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
    btn.addEventListener('click', function() {
      wrap.classList.contains('open') ? closeMenu() : openMenu();
    });
    document.addEventListener('click', function(e) {
      if (!wrap.contains(e.target)) closeMenu();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeMenu();
    });
    links.forEach(function(a) {
      a.addEventListener('click', function() {
        var lang = document.documentElement.getAttribute('data-site-lang') || 'en';
        var text = lang === 'id' ? a.getAttribute('data-label-id') : a.getAttribute('data-label-en');
        var prefix = lang === 'id' ? 'Pilih Bab — ' : 'Select Chapter — ';
        btnLabel.textContent = prefix + text;
        closeMenu();
      });
    });
  })();

  // Page router — shows exactly one chapter at a time, switched via hash
  (function() {
    var chapters = ['ch1', 'ch2', 'ch3', 'ch4', 'ch5'];
    var pages = {};
    chapters.forEach(function(id) { pages[id] = document.getElementById(id); });
    var navLinks = document.querySelectorAll('.chapter-select-menu a, .pager-btn');

    function showChapter(id, opts) {
      if (!pages[id]) id = chapters[0];
      chapters.forEach(function(c) {
        pages[c].classList.toggle('active', c === id);
      });
      navLinks.forEach(function(a) {
        var target = a.getAttribute('href') ? a.getAttribute('href').replace('#', '') : a.getAttribute('data-chapter');
        a.classList.toggle('active', target === id);
      });
      document.documentElement.setAttribute('data-chapter', id);
      // Sync the dropdown button label with the chapter actually on screen
      // (covers menu click, pager buttons, back/forward, refresh, direct #hash links)
      var curLink = document.querySelector('.chapter-select-menu a[href="#' + id + '"]');
      var curLabel = document.querySelector('#chapterSelectBtn .current');
      if (curLink && curLabel) {
        var lg = document.documentElement.getAttribute('data-site-lang') || 'en';
        curLabel.textContent = (lg === 'id' ? 'Pilih Bab — ' : 'Select Chapter — ') +
          (lg === 'id' ? curLink.getAttribute('data-label-id') : curLink.getAttribute('data-label-en'));
      }
      if (!opts || !opts.skipScroll) {
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      }
    }

    function fromHash() {
      var id = (location.hash || '').replace('#', '');
      showChapter(chapters.indexOf(id) !== -1 ? id : chapters[0]);
    }

    document.querySelectorAll('.chapter-select-menu a, .pager-btn').forEach(function(a) {
      a.addEventListener('click', function(e) {
        var id = a.getAttribute('href').replace('#', '');
        if (chapters.indexOf(id) === -1) return;
        e.preventDefault();
        // pushState throws inside sandboxed previews (about:srcdoc, e.g. the claude.ai viewer);
        // fall back to the hash, and always show the chapter regardless.
        try { history.pushState(null, '', '#' + id); }
        catch (err) { try { location.hash = id; } catch (err2) {} }
        showChapter(id);
      });
    });

    window.addEventListener('popstate', fromHash);
    fromHash();
  })();

  // Idle ambient embers — decorative only, pointer-events disabled, respects reduced motion
  (function() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var container = document.getElementById('ambient');
    var count = window.innerWidth < 560 ? 8 : 14;
    for (var i = 0; i < count; i++) {
      var m = document.createElement('div');
      m.className = 'mote';
      var left = Math.random() * 100;
      var duration = 14 + Math.random() * 12;
      var delay = Math.random() * -20;
      var dx = (Math.random() * 60 - 30) + 'px';
      var size = (3 + Math.random() * 3).toFixed(1) + 'px';
      m.style.left = left + 'vw';
      m.style.width = size;
      m.style.height = size;
      m.style.animationDuration = duration + 's';
      m.style.animationDelay = delay + 's';
      m.style.setProperty('--dx', dx);
      container.appendChild(m);
    }
  })();

}
</script>

  var html = document.documentElement;
  var gate = document.getElementById('gate');
  var form = document.getElementById('gateForm');
  var row = document.getElementById('pinRow');
  var msg = document.getElementById('gateMsg');
  var btn = document.getElementById('gateBtn');
  var inputs = Array.prototype.slice.call(row.querySelectorAll('input'));
  var fails = 0;

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function L(en, id) { return html.getAttribute('data-site-lang') === 'id' ? id : en; }

  // language (pre-unlock): saved choice, else browser language
  var lang = 'en';
  try { var s = localStorage.getItem('bh_lang'); if (s === 'en' || s === 'id') lang = s; else if (/^id/i.test(navigator.language || '')) lang = 'id'; } catch (e) {}
  function setGateLang(l) {
    html.setAttribute('data-site-lang', l);
    document.querySelectorAll('[data-gate-lang]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-gate-lang') === l); });
  }
  setGateLang(lang);
  document.querySelectorAll('[data-gate-lang]').forEach(function (b) {
    b.addEventListener('click', function () { setGateLang(b.getAttribute('data-gate-lang')); });
  });

  async function tryPin(pin) {
    var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);

  }

  function unlock(text, pin, keepPos) {
    try { sessionStorage.setItem('do_pin', pin); } catch (e) {}
    // fresh open always starts at Chapter 1; only refresh / back-forward keeps current chapter
    if (!keepPos && location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    var host = document.createElement('div');
    host.innerHTML = text;
    var ref = gate;
    while (host.firstChild) document.body.insertBefore(host.firstChild, ref);
    gate.remove();
    if (typeof initApp === 'function') initApp();
  }

  async function submit(pin, silent) {
    if (!(window.crypto && crypto.subtle)) { msg.textContent = L('This browser cannot unlock the page (needs HTTPS or a modern browser).', 'Browser ini tidak bisa membuka halaman (perlu HTTPS atau browser modern).'); return; }

      } else { btn.disabled = false; inputs[0].focus(); }
    }
  }

  function pinValue() { return inputs.map(function (i) { return i.value; }).join(''); }

  inputs.forEach(function (inp, idx) {
    inp.addEventListener('input', function () {
      inp.value = inp.value.replace(/\D/g, '').slice(-1);
      row.classList.remove('err');
      if (inp.value && idx < 4) inputs[idx + 1].focus();
      if (pinValue().length === 5) submit(pinValue());
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && idx > 0) { inputs[idx - 1].focus(); inputs[idx - 1].value = ''; }
      if (e.key === 'ArrowLeft' && idx > 0) inputs[idx - 1].focus();
      if (e.key === 'ArrowRight' && idx < 4) inputs[idx + 1].focus();
    });
    inp.addEventListener('paste', function (e) {
      var d = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 5);

  var saved = null; try { saved = sessionStorage.getItem('do_pin'); } catch (e) {}
